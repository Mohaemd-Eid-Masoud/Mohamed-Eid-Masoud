<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="#0b1120" stroke="url(#glowGrad)" stroke-width="18" filter="url(#neonGlow)"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#00d2ff" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Stylized M -->
  <rect x="120" y="150" width="48" height="210" rx="14" fill="#00d2ff"/>
  <rect x="344" y="150" width="48" height="210" rx="14" fill="#00d2ff"/>
  <polygon points="168,150 256,270 344,150 320,150 256,240 192,150" fill="#38bdf8"/>
  
  <!-- Analytics Data Bars -->
  <rect x="155" y="390" width="38" height="24" rx="6" fill="#00d2ff" fill-opacity="0.9"/>
  <rect x="215" y="375" width="38" height="39" rx="6" fill="#3b82f6"/>
  <rect x="275" y="360" width="38" height="54" rx="6" fill="#10b981"/>
  <rect x="335" y="380" width="38" height="34" rx="6" fill="#f59e0b"/>
</svg>
